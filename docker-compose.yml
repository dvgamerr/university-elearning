name: university-elearning

services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: e-learning
      MYSQL_USER: vhost
      MYSQL_PASSWORD: "123456"
    volumes:
      - mysql-data:/var/lib/mysql
      # _old connects to "localhost", so share the MySQL unix socket with legacy
      - mysqld-socket:/var/run/mysqld
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Laravel app
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    environment:
      DB_HOST: db
      DB_DATABASE: e-learning
      DB_USERNAME: vhost
      DB_PASSWORD: "123456"
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy

  # old PHP app in _old/
  legacy:
    build:
      context: .
      dockerfile: docker/legacy/Dockerfile
    ports:
      - "${LEGACY_PORT:-8091}:80"
    volumes:
      - mysqld-socket:/var/run/mysqld
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
  mysqld-socket:
